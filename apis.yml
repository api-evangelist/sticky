name: Sticky
description: 'Sticky was a San Francisco-based biometric SaaS company (founded 2009, offices
  in New York and Stockholm) whose cloud platform ran large-scale market research studies
  using webcam eye tracking and emotion analytics — measuring what real people saw, missed,
  and felt when engaging with websites, ads, email, and video. A Northzone portfolio company,
  Sticky was acquired by Tobii on 2017-05-17 and integrated into Tobii Pro, continuing as
  "Sticky by Tobii". The sticky.ai website is no longer online and Sticky publishes no
  public API or developer program.'
